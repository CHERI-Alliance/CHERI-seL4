# Actions to run on pull requests

name: PR

on: [pull_request, workflow_dispatch]

jobs:
  pr-checks:
    name: Checks
    uses: The-Capable-Hub/CHERI-seL4-ci-actions/.github/workflows/pr.yml@cheri
    with:
      runner: the-capable-hub-aws-ci
      container-image: capablehub/tch-ubuntu-24-builder:latest

  preprocess:
    name: Preprocess
    runs-on: the-capable-hub-aws-ci
    container: capablehub/tch-ubuntu-24-builder:latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ARM, ARM_HYP, AARCH64, RISCV64, X64]
        feature: ["", MCS]
        exclude:
          - arch: ARM_HYP
            feature: MCS
          - arch: AARCH64
            feature: MCS
          - arch: X64
            feature: MCS
    steps:
    - uses: The-Capable-Hub/CHERI-seL4-ci-actions/preprocess@cheri
      with:
        L4V_ARCH: ${{ matrix.arch }}
        L4V_FEATURES: ${{ matrix.feature }}
