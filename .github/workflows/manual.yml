# Build a PDF of the seL4 reference manual
name: RefMan

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  manual:
    name: Build PDF
    runs-on: the-capable-hub-aws-ci
    container: capablehub/tch-ubuntu-24-builder:latest
    steps:
    - uses: seL4/ci-actions/seL4-manual@master
    - uses: actions/upload-artifact@v4
      with:
        name: PDF
        path: manual/manual.pdf
