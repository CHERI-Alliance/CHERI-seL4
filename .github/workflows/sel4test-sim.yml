# sel4test simulation runs
#
# See sel4test-sim/builds.yml in the repo seL4/ci-actions for configs.

name: seL4Test

on:
  pull_request:
    paths-ignore:
      - 'manual/**'
      - 'LICENSES/**'
      - '*.md'
  workflow_dispatch:

jobs:
  sim:
    name: Sim
    uses: The-Capable-Hub/CHERI-seL4-ci-actions/.github/workflows/sel4test-sim.yml@cheri
    with:
      runner: the-capable-hub-aws-ci
